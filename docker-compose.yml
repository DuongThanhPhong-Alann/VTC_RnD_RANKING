services:
  vtc-rnd-ranking:
    container_name: vtc-rnd-ranking
    build:
      context: .
      dockerfile: Dockerfile
    image: vtc-rnd-ranking:latest
    restart: unless-stopped
    ports:
      - "${PORT:-7070}:3000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      # Prefer IPv4 first to avoid fetch failures on hosts with broken IPv6 routing.
      NODE_OPTIONS: --dns-result-order=ipv4first
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/login', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
